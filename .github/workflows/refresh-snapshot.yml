name: Refresh demo snapshot

# Rebuilds frontend/src/data/demo-snapshot.json after each U.S. market close
# with that day's real daily closes, and commits it so Vercel redeploys. The
# site falls back to this file whenever the API can't be reached. A run that
# can't get good data fails without committing, so the last good snapshot
# stays in place.

on:
  schedule:
    # weekdays at 21:45 UTC: after the close in both EST and EDT
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Test
        working-directory: backend
        run: python -m pytest tests -q

      - name: Export snapshot
        working-directory: backend
        run: python export_snapshot.py

      - name: Check the new snapshot
        run: |
          python - <<'PY'
          import datetime as dt, json, sys
          s = json.load(open("frontend/src/data/demo-snapshot.json"))
          problems = []
          if len(s["feed"]) < 10 or not s["stocks"]:
              problems.append("too few posts or companies")
          for t, c in s["charts"].items():
              if len(c["prices"]) < 20:
                  problems.append(f"{t}: only {len(c['prices'])} daily closes")
          newest = max((c["prices"][-1]["date"] for c in s["charts"].values() if c["prices"]), default="")
          taken = s["generated_at"][:10]
          if not newest or (dt.date.fromisoformat(taken) - dt.date.fromisoformat(newest)).days > 5:
              problems.append(f"newest close {newest or 'missing'} is stale for {taken}")
          priced = sum(r.get("price_at_post") is not None for r in s["export"])
          if priced < 0.8 * len(s["export"]):
              problems.append(f"only {priced}/{len(s['export'])} export rows have prices")
          if problems:
              print("Keeping the previous snapshot:", *problems, sep="\n  ")
              sys.exit(1)
          print(f"OK: {len(s['feed'])} posts, {len(s['stocks'])} companies, closes through {newest}")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/demo-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Refresh demo snapshot ($(date -u +%Y-%m-%d))"
          git push
